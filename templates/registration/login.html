<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | PriceWatch PH</title>
  </head>
  <body>
    <main>
      <h1>Sign in to PriceWatch PH</h1>
      {% if form.errors %}
        <p role="alert">Your username and password did not match. Please try again.</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form.username.label_tag }}
        {{ form.username }}
        {{ form.password.label_tag }}
        {{ form.password }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
