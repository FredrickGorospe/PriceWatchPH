{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <fieldset class="module aligned">
      {% for field in form %}
        <div class="form-row">
          {{ field.errors }}
          <div>
            {{ field.label_tag }}
            {{ field }}
            {% if field.help_text %}
              <div class="help">{{ field.help_text|safe }}</div>
            {% endif %}
          </div>
        </div>
      {% endfor %}
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="Log trade" class="default">
    </div>
  </form>
</div>
{% endblock %}
