services:
  db:
    # Patch tag resolved against Docker Hub at task-implementation time
    # (see tasks/TASK_001_BOOTSTRAP.md, Unknowns) rather than the floating
    # `postgres:16` tag, so the image doesn't silently drift.
    image: postgres:16.14-bookworm
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: python manage.py migrate --noinput

  web:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --forwarded-allow-ips=127.0.0.1,::1

volumes:
  postgres_data:
